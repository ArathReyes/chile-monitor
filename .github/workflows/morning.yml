# Morning job: refresh every source, publish the DuckDB file, rebuild the static site
# (GitHub Pages, gh-pages branch), email the report.
# Mon-Fri 05:05 New York. GitHub cron is UTC with no DST, so it fires at 09:05 UTC (EDT) and
# 10:05 UTC (EST); `--at-ny-hour 5` lets only the right one through. GitHub may start
# scheduled runs late; a second run the same NY day is skipped.
name: morning
on:
  schedule:
    - cron: "5 9 * * 1-5"
    - cron: "5 10 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if it already ran today / outside 05:xx NY"
        type: boolean
        default: true
permissions:
  contents: write  # upload the release asset, push gh-pages
concurrency:
  group: morning
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/New_York
      DATA_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BCCH_API_TOKEN: ${{ secrets.BCCH_API_TOKEN }}
      AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
      AGENTMAIL_INBOX: ${{ vars.AGENTMAIL_INBOX }}
      REPORT_TO: ${{ vars.REPORT_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Morning run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            uv run python -m monitor.jobs.morning_all --pull --publish --site --deploy-site --email --force
          else
            uv run python -m monitor.jobs.morning_all --pull --publish --site --deploy-site --email --at-ny-hour 5
          fi
