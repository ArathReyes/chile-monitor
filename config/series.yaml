    tab: monetary_policy
    transform: level
    verified: true  # confirmed via SearchSeries 2026-11-14
    notes: Traded rate, 360-day simple basis, T-1. Harmonize basis before mixing with tenor table.

  - series_id: cl_spc_nom_360d
    source: bcch
