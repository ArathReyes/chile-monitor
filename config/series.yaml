    tab: monetary_policy
    transform: level
    verified: true  # confirmed via SearchSeries 2026-11-14
    notes: Traded rate, 360-day simple basis, T-1.

  - series_id: cl_imacec
    source: bcch
    source_code: F032.IMC.IND.Z.Z.EP18.Z.Z.0.M
    name: IMACEC empalmado, serie original (2018=100)
    freq: M
    unit: index
    tab: chile_macro
    transform: level
    verified: true  # confirmed via SearchSeries 2026-11-14
    notes: >-
      Reference year 2018 is still current for IMACEC. SA variant: F032.IMC.IND.Z.Z.EP18.Z.Z.1.M;
      non-mining: ...EP18.N03.Z.0.M; mining: ...EP18.03.Z.0.M.

  - series_id: cl_cpi
    source: bcch
    source_code: F074.IPC.IND.Z.2023.C.M
    name: IPC General (Prom. 2023=100), INE
    freq: M
    unit: index
    tab: chile_macro
    transform: level
    verified: true  # confirmed via SearchSeries 2026-11-14
    notes: >-
      Official INE index. BCCh-spliced alternative with long history: G073.IPC.IND.2023.M
      (IPC Analíticos family, also has SAE/volátiles splits). Divisions: F074.IPC.IND.DIV*.2023.C.M.

