# Series registry. Adding a series = adding an entry here.
# verified: true only when the code was confirmed against the source
# (BDE: monitor.sources.bcch.search_series, or an official doc example).
# source_code "VERIFY" = unknown; jobs must skip it until filled in.
series:
  - series_id: cl_tpm
    source: bcch
    source_code: F022.TPM.TIN.D001.NO.Z.D
    name: Tasa de Política Monetaria (TPM)
    freq: D
    unit: pct
    tab: monetary_policy
    transform: level
    verified: true
    notes: Code and description confirmed by the GetSeries example in the official BDE REST docs.

  - series_id: cl_spc_nom_10y
    source: bcch
    source_code: F022.SPC.TIN.AN10.NO.Z.D
    name: SPC nominal 10y
    freq: D
    unit: pct
    tab: curves_rates
    transform: level
    verified: true  # confirmed via SearchSeries 2026-11-14
    notes: 1y-10y tenor table, 365-day basis, closing data.

  - series_id: cl_spc_uf_2y
    source: bcch
    source_code: F022.SPC.TIN.AN02.UF.Z.D
    name: SPC UF 2y
    freq: D
    unit: pct
    tab: curves_rates
    transform: level
    verified: true  # confirmed via SearchSeries 2026-11-14
    notes: Real (UF) Cámara swap, 365-day basis, closing data.

  - series_id: cl_spc_nom_90d
    source: bcch
    source_code: F022.SPC.TPR.D090.NO.Z.D
