# Monetary policy meeting calendar. Times are local to the central bank.
# Fields: meeting_id, start_date (first day of a 2-day RPM, optional), decision_date,
# decision_time_local (America/Santiago), effective_date (defaults to next CL business day),
# has_ipom, source, confirmed (true only once checked against the official BCCh calendar).
# TODO: confirm/complete from the BCCh calendar page
#   (https://www.bcentral.cl/es/web/banco-central/noticias-y-publicaciones/prensa/calendario-de-politica-monetaria-y-financiera
#    — URL cited by Polymarket's market rules; bcentral.cl blocks automated access, so save it manually
#    into data/manual/bcch_web/calendar/).
bcch:
  timezone: America/Santiago
  meetings:
    - meeting_id: RPM-2026-10
      decision_date: 2026-10-27
